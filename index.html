<!DOCTYPE html>
<html lang="en-ZA"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IOL Two Oceans Marathon 2027 Race Week Companion (300×600)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pg:#eceff3;--bg:#fff;--ink:#111;--mu:#5b6270;--ln:#e1e4ea;--sel:#f3f5f8;--nv:#222552;--bl:#0f6fb9;--or:#f7941d;--gn:#7ab929;--lk:#0f6fb9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#000;--bg:#13151c;--ink:#f1f2f5;--mu:#a6acba;--ln:#2d3140;--sel:#1c1f2a;--lk:#6db3f0;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#000;--bg:#13151c;--ink:#f1f2f5;--mu:#a6acba;--ln:#2d3140;--sel:#1c1f2a;--lk:#6db3f0;color-scheme:dark}
html{box-sizing:border-box}body{margin:0;background:var(--pg);display:grid;place-items:center;min-height:100vh;padding:16px;font:14px 'Barlow',system-ui,sans-serif}
.cap{font:12px 'Barlow',system-ui,sans-serif;color:var(--mu);margin:8px 0 0;text-align:center;max-width:300px}
/* Widget styles are scoped to #tom so host-page CSS can't leak in */
#tom{all:initial;display:flex;flex-direction:column;position:relative;width:300px;height:600px;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 'Barlow',system-ui,sans-serif;border:1px solid var(--ln);box-sizing:border-box}
#tom *{box-sizing:border-box}
#tom .top{flex:none;background:#fff;color:#111;display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid #e1e4ea}
#tom .top img{height:22px;display:block}#tom .top span{font:700 .78rem 'Barlow Condensed',sans-serif;letter-spacing:.04em;flex:1}
#tom button{font:inherit;color:inherit;cursor:pointer}
#tom .hm{min-height:32px;padding:0 8px;border:1px solid #111;background:#fff;color:#111;font-size:.78rem;font-weight:600;border-radius:2px}
#tom .brand{flex:none;background:var(--nv);height:62px;display:grid;place-items:center;border-bottom:3px solid var(--or);position:relative}#tom .brand img{height:52px;display:block}
#tom .brand::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--bl) 0 33%,var(--gn) 33% 66%,var(--or) 66%)}
#tom main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;animation:f .2s}@keyframes f{from{opacity:0}}
@media (prefers-reduced-motion:reduce){#tom main{animation:none}}
#tom h1,#tom h2,#tom h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;line-height:1.1;margin:0 0 6px}
#tom h1{font-size:2rem;color:var(--ink)}#tom h2{font-size:1.4rem;padding-left:8px;border-left:4px solid var(--bl)}#tom h3{font-size:1.05rem}
#tom .kick{font:700 .8rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;color:var(--bl);margin-bottom:4px}
#tom p{margin:0 0 8px}#tom .mu{color:var(--mu);font-size:.82rem}
#tom .opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin:0 0 8px;padding:8px 12px;text-align:left;border:1px solid var(--ln);border-left:4px solid var(--bl);background:var(--bg);border-radius:2px;font-weight:600}
#tom .opt:hover{background:var(--sel)}#tom .opt small{display:block;font-weight:400;color:var(--mu)}#tom .opt b{font-size:1.3rem}
#tom .acc{border-top:1px solid var(--ln)}#tom .acc>button{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;font-weight:600;padding:6px 0}
#tom .acc>div{padding:0 0 10px}#tom .dt{display:inline-block;min-width:42px;text-align:center;background:var(--nv);color:#fff;font:700 .8rem/1.1 'Barlow Condensed',sans-serif;padding:3px 4px;margin-right:8px}
#tom dl{margin:0 0 8px}#tom dt{font-weight:600;font-size:.78rem;color:var(--mu)}#tom dd{margin:0 0 6px}
#tom .tbd{background:var(--sel);padding:0 5px;font-style:italic}
#tom a.ln{display:inline-flex;align-items:center;min-height:40px;color:var(--lk);font-weight:600}
#tom .cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;background:var(--bl);color:#fff;text-decoration:none;font-weight:600;border:0;border-radius:2px;margin:6px 0}
#tom .spon{border:1px dashed var(--mu);background:var(--sel);padding:8px 10px;margin:10px 0;font-size:.8rem}#tom .spon button{all:unset;cursor:pointer;display:block;color:var(--lk);font-weight:600;min-height:32px;padding-top:4px}#tom .spon b{color:var(--mu);font-size:.72rem;letter-spacing:.04em}
#tom .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}#tom .chip{min-height:40px;padding:0 10px;border:1px solid var(--ln);background:var(--bg);border-radius:20px;font-size:.82rem}#tom .chip[aria-pressed=true]{background:var(--nv);color:#fff;border-color:var(--nv)}
#tom .it{display:flex;gap:10px;align-items:center;min-height:44px;border-bottom:1px solid var(--ln);cursor:pointer}#tom .it input{width:22px;height:22px;accent-color:var(--gn);flex:none}#tom .it input:checked+span{text-decoration:line-through;color:var(--mu)}
#tom progress{width:100%;height:8px;accent-color:var(--gn)}
#tom ul{margin:4px 0 8px;padding-left:18px}#tom li{margin-bottom:3px}
#tom .tabs{flex:none;display:flex;border-top:1px solid var(--ln);background:var(--bg)}
#tom .tabs button{flex:1;min-height:48px;padding:2px 0;border:0;border-top:3px solid transparent;background:none;color:var(--mu);font-size:.72rem;font-weight:600}#tom .tabs button[aria-current=true]{color:var(--ink);border-top-color:var(--or)}
#tom .back{min-height:36px;border:0;background:none;color:var(--lk);font-weight:600;padding:0;margin-bottom:4px}
#tom :focus-visible{outline:3px solid var(--or);outline-offset:1px}
#tom .note{border-left:3px solid var(--or);background:var(--sel);padding:6px 8px;font-size:.78rem;color:var(--mu);margin:8px 0}
#tom details{border-top:1px solid var(--ln);padding:8px 0;font-size:.8rem}#tom code{font-size:.74rem}
#tom .toast{position:absolute;left:10px;right:10px;bottom:56px;background:#111;color:#fff;padding:9px 12px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:.82rem}#tom .toast.on{opacity:1}
</style></head><body>

<main id="v" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections"></nav>
<div class="toast" id="t" role="status" aria-live="polite"></div>
</div>
<p class="cap">Prototype · 300×600 widget. Sample content: confirm everything with official organiser information.</p>
</div>
<script>
// ---------- Central, editable content ----------
const OFFICIAL='https://www.twooceansmarathon.org.za/';
const TBC='Official details to be confirmed';
const DATA={
events:[
{id:'night',n:'8km Night Run',d:'Wednesday, 31 March',s:'Wed 31 Mar',dist:'8 km',g:'Night event: check official guidance on visibility and what to wear.'},
{id:'friend',n:'International Friendship Run',d:'Thursday, 1 April',s:'Thu 1 Apr',dist:'4.5 km',g:'Check official guidance on participation and registration for this run.'},
{id:'trail',n:'Trail Run',d:'Friday, 2 April',s:'Fri 2 Apr',dist:'Distance to be confirmed',g:'Check official trail conditions, kit and safety guidance.'},
{id:'half',n:'Half Marathon',d:'Saturday, 3 April',s:'Sat 3 Apr',dist:'21.1 km',g:'Check official cut-offs, seeding and start-pen information.'},
{id:'ultra',n:'Ultra Marathon',d:'Sunday, 4 April',s:'Sun 4 Apr',dist:'56 km',g:'Check official cut-offs, hydration points and race rules.'}],
prep:[['Race pack collection','Collection is linked to the Race Pack Collection and Expo at CTICC 1, Cape Town (1–3 April 2027). Confirm your collection day, times and what to bring with the organisers.'],
['Race-day preparation','Lay out your kit the night before, set two alarms, and read the official race-day briefing for your event.'],
['Nutrition and hydration','Stick to food and drink you have practised in training. Check official hydration point information for your race. This is general information, not personal advice.'],
['Travel and arrival','Plan how you will reach the start and allow extra time. Official transport and road-closure updates will apply: '+TBC+'.']],
checklist:['Confirm race registration','Check race pack collection details','Prepare running kit','Check footwear and equipment','Plan transport to the start','Review official race information'],
spect:[['Race-day viewing',TBC],['Spectator locations',TBC],['Transport guidance',TBC],['Road closures',TBC]],
tips:['Agree a meeting point and a backup before the start.','Make sure your phone is charged and tell your runner where you will be.','Bring water, snacks and weather-appropriate layers.','A clear sign and a loud cheer go a long way.'],
explore:{dine:{l:'Dining',i:[['V&A Waterfront dining','Waterfront restaurants and views.','https://www.waterfront.co.za'],['Bree Street area','City centre restaurant and café strip.'],['Kloof Street area','Casual dining in the City Bowl.']]},
stay:{l:'Stay',i:[['City Bowl and CBD','Close to the CTICC and Expo.'],['Green Point and Sea Point','Coastal areas with promenade walks.'],['Find accommodation','Official visitor information.','https://www.capetown.travel']]},
do:{l:'Do',i:[['Table Mountain','Cable car and hiking trails.','https://www.tablemountain.net'],['Kirstenbosch Gardens','Botanical garden at the foot of the mountain.','https://www.sanbi.org/gardens/kirstenbosch/'],['Boulders Beach','Penguin colony near Simon’s Town.']]},
go:{l:'Get around',i:[['MyCiTi bus','Cape Town’s bus network.','https://www.myciti.org.za'],['Ride-hailing','Check availability in the app of your choice.'],['Race-week transport','Official updates: '+TBC+'.']]},
rest:{l:'Recover',i:[['Easy promenade walk','Gentle movement after race day, e.g. Sea Point.'],['Beach time','Cool off at a Cape Town beach, weather permitting.'],['Massage and spa','Ask your accommodation for suggestions.']]}},
expo:{venue:'CTICC 1, Cape Town',dates:'1–3 April 2027',space:'Expanded exhibition space across Halls 1–4',cats:['Running apparel and equipment','Sports nutrition and hydration','Recovery and fitness products']},
sponsors:{prepare:['Running apparel and footwear','[Partner] kit and shoe offer placeholder'],spectate:['Restaurants and hospitality','[Partner] post-race meal placeholder'],explore:['Accommodation and travel','[Partner] stay and travel placeholder'],expo:['Fitness technology and wearables','[Partner] wearables placeholder'],guide:['Sports nutrition and hydration','[Partner] nutrition placeholder']}};
// ---------- State and helpers ----------
const S={v:'home',hist:[],open:{},ck:new Set(),race:'half',cat:'dine'};
const $=s=>document.querySelector(s),v=$('#v');
const track=n=>console.debug('[IOL widget event]',n);
const toast=m=>{const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)};
const TABS=[['guide','Guide'],['prepare','Prepare'],['spectate','Watch'],['explore','Explore'],['expo','Expo']];
$('.tabs').innerHTML=TABS.map(([k,l])=>`<button data-a="go" data-v="${k}">${l}</button>`).join('');
const link=(u,t,k)=>`<a class="ln" href="${u}" target="_blank" rel="noopener noreferrer" data-a="ext" data-k="${k}">${t} ↗</a>`;
const acc=(id,t,b)=>`<div class="acc"><button aria-expanded="${!!S.open[id]}" data-a="acc" data-id="${id}"><span>${t}</span><span aria-hidden="true">${S.open[id]?'−':'+'}</span></button><div ${S.open[id]?'':'hidden'}>${b}</div></div>`;
const spon=k=>{const s=DATA.sponsors[k];return `<div class="spon"><b>SPONSORED · ${s[0].toUpperCase()}</b><br>${s[1]}<button data-a="spon" data-k="${k}">Learn more</button></div>`};
const hd=(t,back)=>(back?'<button class="back" data-a="back">← Back</button>':'')+`<h2>${t}</h2>`;
const disc='<p class="note">General information only. Follow official event rules and your own training or medical guidance.</p>';
// ---------- Views ----------
const VIEWS={
home(){return `<div class="kick">IOL | TWO OCEANS MARATHON 2027</div><h1>Your Race Week Companion</h1><p class="mu" style="font-size:.95rem">Everything you need to prepare, participate and experience race week.</p>`+
[['run','🏃','I’m running','Prepare for race week'],['sup','📣','I’m supporting a runner','Spectator guide'],['vis','🌊','I’m visiting Cape Town','Eat, stay and explore'],['fol','📰','I’m following the event','Race week programme']].map(([k,e,t,s])=>`<button class="opt" data-a="who" data-k="${k}"><b aria-hidden="true">${e}</b><span>${t}<small>${s}</small></span></button>`).join('')+
`<details><summary><b>Notes for IOL developers</b></summary><p class="mu">Suggested events for production (not connected here; this prototype only logs to the console):</p><ul><li><code>widget_loaded</code></li><li><code>welcome_interaction</code></li><li><code>user_type_selected</code></li><li><code>race_event_selected</code></li><li><code>section_viewed</code></li><li><code>checklist_item_completed</code></li><li><code>external_link_clicked</code></li><li><code>sponsor_placement_clicked</code></li></ul><p class="mu">Event data lives in the DATA object. Official details are placeholders until confirmed by the organiser.</p></details>`},
guide(){return hd('Race Week Guide')+'<p class="mu">Tap an event for details.</p>'+DATA.events.map(e=>acc('e'+e.id,`<span class="dt">${e.s.toUpperCase()}</span>${e.n}`,`<dl><dt>Date</dt><dd>${e.d}</dd><dt>Distance</dt><dd>${e.dist}</dd><dt>Start and finish</dt><dd><span class="tbd">${TBC}</span></dd><dt>Guidance</dt><dd>${e.g}</dd></dl>${link(OFFICIAL,'Official event information','event_'+e.id)}`)).join('')+spon('guide')},
prepare(){const d=S.ck.size,n=DATA.checklist.length;return hd('Runner Preparation')+`<h3>Your checklist</h3><progress max="${n}" value="${d}" aria-label="Checklist progress"></progress><p class="mu">${d} of ${n} done${d===n?'. Well prepared!':''}</p>`+DATA.checklist.map((c,i)=>`<label class="it"><input type="checkbox" data-ck="${i}" ${S.ck.has(i)?'checked':''}><span>${c}</span></label>`).join('')+'<div style="height:10px"></div>'+DATA.prep.map((p,i)=>acc('p'+i,p[0],`<p>${p[1]}</p>`)).join('')+spon('prepare')+disc},
spectate(){const e=DATA.events.find(x=>x.id===S.race);return hd('Spectator Guide')+'<p class="mu">Which race are you attending?</p><div class="chips" role="group" aria-label="Race">'+DATA.events.map(x=>`<button class="chip" aria-pressed="${x.id===S.race}" data-a="race" data-id="${x.id}">${x.n.replace(' Run','').replace('International ','')}</button>`).join('')+`</div><h3>${e.n} · ${e.s}</h3><dl>${DATA.spect.map(s=>`<dt>${s[0]}</dt><dd><span class="tbd">${s[1]}</span></dd>`).join('')}</dl><h3>Meeting point ideas</h3><p class="mu">Choose a clear landmark away from the busiest spots, agree a time, and name a backup.</p><h3>Supporting your runner</h3><ul>${DATA.tips.map(t=>`<li>${t}</li>`).join('')}</ul>${link(OFFICIAL,'Official event updates','spectator')}${spon('spectate')}`},
explore(){const c=DATA.explore[S.cat];return hd('Explore Cape Town')+'<div class="chips" role="group" aria-label="Category">'+Object.entries(DATA.explore).map(([k,x])=>`<button class="chip" aria-pressed="${k===S.cat}" data-a="cat" data-id="${k}">${x.l}</button>`).join('')+'</div><p class="note" style="margin-top:0">Illustrative suggestions, not verified event partners.</p>'+c.i.map(i=>`<div class="acc" style="padding:8px 0"><h3 style="margin:0">${i[0]}</h3><p class="mu" style="margin:0">${i[1]}</p>${i[2]?link(i[2],'Visit website','explore'):''}</div>`).join('')+spon('explore')},
expo(){const x=DATA.expo;return hd('Race Pack Collection and Expo')+`<div class="note" style="border-color:var(--bl)">Details subject to confirmation against official organiser communications.</div><dl><dt>Venue</dt><dd>${x.venue}</dd><dt>Dates</dt><dd>${x.dates}</dd><dt>Space</dt><dd>${x.space}</dd></dl><p>Collect your race pack and explore what is on offer at the Expo.</p><h3>Exhibitor categories</h3><ul>${x.cats.map(c=>`<li>${c}</li>`).join('')}</ul><a class="cta" href="${OFFICIAL}" target="_blank" rel="noopener noreferrer" data-a="ext" data-k="expo">Official Expo information ↗</a>${spon('expo')}`}};
function render(keep){const st=v.scrollTop;v.innerHTML=VIEWS[S.v]();v.scrollTop=keep?st:0;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.v))}
function go(x){if(x===S.v)return;S.hist.push(S.v);S.v=x;track('section_viewed:'+x);render()}
// ---------- Actions ----------
document.addEventListener('click',e=>{const el=e.target.closest('#tom [data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
if(a==='go'){if(el.dataset.v==='home')S.hist=[];go(el.dataset.v)}
else if(a==='back'){S.v=S.hist.pop()||'home';render()}
else if(a==='who'){track('user_type_selected:'+el.dataset.k);go({run:'prepare',sup:'spectate',vis:'explore',fol:'guide'}[el.dataset.k])}
else if(a==='acc'){S.open[id]=!S.open[id];if(S.open[id]&&id[0]==='e')track('race_event_selected:'+id.slice(1));render(true)}
else if(a==='race'){S.race=id;track('race_event_selected:'+id);render(true)}
else if(a==='cat'){S.cat=id;render(true)}
else if(a==='ext')track('external_link_clicked:'+el.dataset.k)
else if(a==='spon'){track('sponsor_placement_clicked:'+el.dataset.k);toast('Sponsor placeholder. A partner link would open here.')}});
document.addEventListener('change',e=>{const i=e.target.dataset.ck;if(i===undefined)return;const n=+i;e.target.checked?S.ck.add(n):S.ck.delete(n);if(e.target.checked)track('checklist_item_completed');render(true);const b=document.querySelector(`[data-ck="${n}"]`);b&&b.focus()});
track('widget_loaded');render();
</script></body></html>
